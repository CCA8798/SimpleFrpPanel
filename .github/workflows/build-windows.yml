name: Build Windows

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Windows x64

    runs-on: windows-2022

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ----------------------------------------------------------
      # Qt 5.14.2 + MinGW 7.3
      # ----------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.14.2
          arch: win64_mingw73
          modules: qtbase
          cache: true

      # ----------------------------------------------------------
      # Environment
      # ----------------------------------------------------------
      - name: Check Environment
        shell: powershell
        run: |
          Write-Host "========== Qt =========="
          qmake --version

          Write-Host ""
          Write-Host "========== CMake =========="
          cmake --version

          Write-Host ""
          Write-Host "========== GCC =========="
          g++ --version

      # ----------------------------------------------------------
      # Configure
      # ----------------------------------------------------------
      - name: Configure CMake
        shell: powershell
        run: |
          cmake `
            -S . `
            -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DQT_SDK_DIR="$env:Qt5_DIR"

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build
        shell: powershell
        run: |
          cmake --build build --parallel

      # ----------------------------------------------------------
      # Check output
      # ----------------------------------------------------------
      - name: Check Build
        shell: powershell
        run: |
          if (!(Test-Path "build/SimpleFrpPanel.exe")) {
              Write-Error "SimpleFrpPanel.exe not found!"
              exit 1
          }

          Write-Host ""
          Write-Host "========== Build Output =========="

          Get-ChildItem build -Recurse |
            Where-Object {
              $_.Extension -in @(
                ".exe",
                ".dll"
              )
            } |
            Select-Object FullName

      # ----------------------------------------------------------
      # Package
      # ----------------------------------------------------------
      - name: Package
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path package

          Copy-Item `
            "build/*" `
            "package/" `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "package/*" `
            -DestinationPath "SimpleFrpPanel-Windows-x64.zip" `
            -Force

      # ----------------------------------------------------------
      # Upload Artifact
      # ----------------------------------------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleFrpPanel-Windows-x64
          path: SimpleFrpPanel-Windows-x64.zip
          if-no-files-found: error
